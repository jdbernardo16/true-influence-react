<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Speak & Rise - Enrollment Form Header</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
                    "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
                    "Helvetica Neue", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background-color: #1a1a4e;
                min-height: 100vh;
            }

            /* Header/Navigation Styles */
            .header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 50;
                background-color: rgba(26, 26, 78, 1);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 1px solid rgba(250, 248, 245, 0.1);
                box-shadow:
                    0 4px 6px -1px rgba(0, 0, 0, 0.1),
                    0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }

            .header-container {
                max-width: 72rem;
                margin: 0 auto;
                padding: 1rem 1.5rem;
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            @media (min-width: 768px) {
                .header-container {
                    padding-left: 3rem;
                    padding-right: 3rem;
                }
            }

            /* Logo Button */
            .logo-button {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: none;
                border: none;
                cursor: pointer;
                padding: 0;
                text-decoration: none;
                transition: opacity 0.2s ease;
            }

            .logo-button:hover {
                opacity: 0.8;
            }

            .logo-button:active {
                opacity: 0.6;
            }

            .logo-image {
                width: 2.5rem;
                height: 2.5rem;
                display: block;
            }

            /* Back to Home Button */
            .back-button {
                background: none;
                border: none;
                color: rgba(250, 248, 245, 0.6);
                font-size: 0.875rem;
                font-weight: 500;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                cursor: pointer;
                padding: 0.5rem 1rem;
                border-radius: 0.375rem;
                transition: all 0.2s ease;
                text-decoration: none;
            }

            .back-button:hover {
                color: #d4952a;
                background-color: rgba(212, 149, 42, 0.1);
            }

            .back-button:active {
                background-color: rgba(212, 149, 42, 0.15);
            }

            /* Demo Content */
            .demo-content {
                padding-top: 6rem;
                padding-bottom: 8rem;
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                max-width: 48rem;
                margin: 0 auto;
                text-align: center;
            }

            .demo-title {
                font-family: Georgia, "Times New Roman", Times, serif;
                font-size: 2.5rem;
                color: #faf8f5;
                margin-bottom: 1rem;
            }

            @media (min-width: 768px) {
                .demo-title {
                    font-size: 3rem;
                }
            }

            .demo-subtitle {
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: #d4952a;
                margin-bottom: 1.5rem;
            }

            .demo-description {
                font-size: 1.125rem;
                font-weight: 300;
                line-height: 1.75;
                color: rgba(250, 248, 245, 0.7);
            }

            /* Responsive adjustments */
            @media (max-width: 640px) {
                .logo-image {
                    width: 2rem;
                    height: 2rem;
                }

                .back-button {
                    font-size: 0.75rem;
                    padding: 0.375rem 0.75rem;
                }

                .demo-title {
                    font-size: 2rem;
                }
            }
        </style>
    </head>
    <body>
        <!-- Header / Navigation -->
        <header class="header">
            <div class="header-container">
                <!-- Logo Button -->
                <a href="/" class="logo-button">
                    <img
                        src="https://trueinfluencemethod.com/icononly_transparent_nobuffer.png"
                        alt="True Influence Method Logo"
                        class="logo-image"
                    />
                </a>

                <!-- Back to Home Button -->
                <a href="/" class="back-button">Back to Home</a>
            </div>
        </header>

        <!-- Demo Content (to show header in context) -->
        <main class="demo-content">
            <p class="demo-subtitle">🔐 ENROLLMENT FORM</p>
            <h1 class="demo-title">Speak & Rise</h1>
            <p class="demo-description">
                C-Suite Private Group Training – Transform your message and
                command the stage with confidence.
            </p>
        </main>

        <script>
            // Optional: Add smooth scroll behavior
            document.querySelectorAll('a[href^="/"]').forEach((anchor) => {
                anchor.addEventListener("click", function (e) {
                    e.preventDefault();
                    console.log(
                        "Navigation clicked:",
                        this.getAttribute("href"),
                    );
                    // In a real application, this would navigate to the home page
                });
            });
        </script>
    </body>
</html>
