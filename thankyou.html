<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Thank You - Speak & Rise Enrollment</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
                    "Oxygen", "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans",
                    "Helvetica Neue", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                background-color: #1a1a4e;
                min-height: 100vh;
            }

            /* Header/Navigation Styles */
            .header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 50;
                background-color: rgba(26, 26, 78, 1);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-bottom: 1px solid rgba(250, 248, 245, 0.1);
                box-shadow:
                    0 4px 6px -1px rgba(0, 0, 0, 0.1),
                    0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }

            .header-container {
                max-width: 72rem;
                margin: 0 auto;
                padding: 1rem 1.5rem;
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            @media (min-width: 768px) {
                .header-container {
                    padding-left: 3rem;
                    padding-right: 3rem;
                }
            }

            /* Logo Button */
            .logo-button {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: none;
                border: none;
                cursor: pointer;
                padding: 0;
                text-decoration: none;
                transition: opacity 0.2s ease;
            }

            .logo-button:hover {
                opacity: 0.8;
            }

            .logo-button:active {
                opacity: 0.6;
            }

            .logo-image {
                width: 2.5rem;
                height: 2.5rem;
                display: block;
            }

            /* Back to Home Button */
            .back-button {
                background: none;
                border: none;
                color: rgba(250, 248, 245, 0.6);
                font-size: 0.875rem;
                font-weight: 500;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                cursor: pointer;
                padding: 0.5rem 1rem;
                border-radius: 0.375rem;
                transition: all 0.2s ease;
                text-decoration: none;
            }

            .back-button:hover {
                color: #d4952a;
                background-color: rgba(212, 149, 42, 0.1);
            }

            .back-button:active {
                background-color: rgba(212, 149, 42, 0.15);
            }

            /* Main Content */
            .main-content {
                padding-top: 8rem;
                padding-bottom: 8rem;
                padding-left: 1.5rem;
                padding-right: 1.5rem;
                max-width: 32rem;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            /* Success Icon */
            .success-icon {
                width: 4rem;
                height: 4rem;
                background-color: rgba(212, 149, 42, 0.2);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 1.5rem;
            }

            .success-icon svg {
                width: 2rem;
                height: 2rem;
                color: #d4952a;
            }

            /* Success Title */
            .success-title {
                font-family: Georgia, "Times New Roman", Times, serif;
                font-size: 1.5rem;
                color: #faf8f5;
                margin-bottom: 1.5rem;
            }

            @media (min-width: 768px) {
                .success-title {
                    font-size: 2rem;
                }
            }

            /* Info Box */
            .info-box {
                width: 100%;
                background-color: rgba(250, 248, 245, 0.05);
                border-radius: 0.75rem;
                padding: 1.5rem;
                margin-bottom: 1.5rem;
                text-align: left;
                border: 1px solid rgba(212, 149, 42, 0.2);
            }

            .info-box-title {
                color: rgba(250, 248, 245, 0.8);
                font-weight: 500;
                margin-bottom: 1rem;
                font-size: 1rem;
            }

            .info-list {
                list-style: none;
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
            }

            .info-list-item {
                display: flex;
                align-items: flex-start;
                gap: 0.5rem;
                color: rgba(250, 248, 245, 0.7);
                font-size: 0.875rem;
            }

            .info-list-item span:first-child {
                color: #d4952a;
                margin-top: 0.25rem;
            }

            /* Start Message */
            .start-message {
                color: #d4952a;
                font-weight: 600;
                margin-bottom: 1.5rem;
                font-size: 1.125rem;
            }

            /* Primary Button */
            .primary-button {
                background-color: #d4952a;
                color: #1a1a4e;
                font-weight: 600;
                padding: 0.75rem 2rem;
                border: none;
                border-radius: 0.5rem;
                cursor: pointer;
                font-size: 1rem;
                transition: all 0.2s ease;
                text-decoration: none;
                box-shadow:
                    0 4px 6px -1px rgba(0, 0, 0, 0.1),
                    0 2px 4px -1px rgba(0, 0, 0, 0.06);
            }

            .primary-button:hover {
                background-color: #e8a838;
                box-shadow:
                    0 10px 15px -3px rgba(212, 149, 42, 0.2),
                    0 4px 6px -2px rgba(212, 149, 42, 0.1);
            }

            .primary-button:active {
                background-color: #d4952a;
                transform: translateY(1px);
            }

            /* Footer */
            .footer {
                border-top: 1px solid rgba(250, 248, 245, 0.1);
                padding: 3rem 1.5rem;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .footer-logo {
                width: 3rem;
                height: 3rem;
                opacity: 0.3;
                filter: grayscale(100%);
                margin-bottom: 1.5rem;
            }

            .footer-copyright {
                font-size: 0.75rem;
                color: rgba(250, 248, 245, 0.3);
                text-transform: uppercase;
                letter-spacing: 0.1em;
            }

            /* Responsive adjustments */
            @media (max-width: 640px) {
                .logo-image {
                    width: 2rem;
                    height: 2rem;
                }

                .back-button {
                    font-size: 0.75rem;
                    padding: 0.375rem 0.75rem;
                }

                .main-content {
                    padding-top: 6rem;
                }

                .success-title {
                    font-size: 1.25rem;
                }

                .info-box {
                    padding: 1rem;
                }
            }
        </style>
    </head>
    <body>
        <!-- Header / Navigation -->
        <header class="header">
            <div class="header-container">
                <!-- Logo Button -->
                <a href="/" class="logo-button">
                    <img
                        src="https://trueinfluencemethod.com/icononly_transparent_nobuffer.png"
                        alt="True Influence Method Logo"
                        class="logo-image"
                    />
                </a>

                <!-- Back to Home Button -->
                <a href="/" class="back-button">Back to Home</a>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Success Icon -->
            <div class="success-icon">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
            </div>

            <!-- Success Title -->
            <h1 class="success-title">You are officially enrolled!</h1>

            <!-- Info Box -->
            <div class="info-box">
                <p class="info-box-title">Watch your inbox for:</p>
                <ul class="info-list">
                    <li class="info-list-item">
                        <span>•</span>
                        <span>Session calendar invites</span>
                    </li>
                    <li class="info-list-item">
                        <span>•</span>
                        <span>Zoom link</span>
                    </li>
                    <li class="info-list-item">
                        <span>•</span>
                        <span>Preparation materials</span>
                    </li>
                    <li class="info-list-item">
                        <span>•</span>
                        <span>Stage details</span>
                    </li>
                </ul>
            </div>

            <!-- Start Message -->
            <p class="start-message">We begin Friday.</p>

            <!-- Back to Home Button -->
            <a href="/" class="primary-button">Back to Home</a>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <img
                src="https://trueinfluencemethod.com/icononly_transparent_nobuffer.png"
                alt="True Influence Method Logo"
                class="footer-logo"
            />
            <p class="footer-copyright">
                © 2024 Joanna Horton McPherson. All rights reserved.
            </p>
        </footer>

        <script>
            // Optional: Add smooth scroll behavior
            document.querySelectorAll('a[href^="/"]').forEach((anchor) => {
                anchor.addEventListener("click", function (e) {
                    e.preventDefault();
                    console.log(
                        "Navigation clicked:",
                        this.getAttribute("href"),
                    );
                    // In a real application, this would navigate to the home page
                });
            });
        </script>
    </body>
</html>
